<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>deadend-iframe-unwired</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  iframe { width: 100%; height: 320px; border: 1px solid #cbd5e1; }
</style>
</head>
<body>
<h1>平台外壳</h1>
<p>真正承载应用的是下面这层 iframe，外壳自己没有可交互控件。</p>
<iframe src="app-unwired.html" title="app"></iframe>

<!-- 没有任何 GSPP 相关代码：与 index.html 同一形态，但内层文档故意一个 document/window
     级监听器都不挂。这是必须的：click_wiring 量的是"链上有没有监听器"，不是"处理器会不会
     理这个 target"，所以只要 document 上挂了 click，本文档里每个控件都算接了线 ——
     「真没接线」的负对照只能住在另一份文档里，不能和委托正对照共用一个 document。 -->
</body>
</html>
