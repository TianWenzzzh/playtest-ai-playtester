<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>deadend-iframe</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  iframe { width: 100%; height: 320px; border: 1px solid #cbd5e1; }
</style>
</head>
<body>
<h1>平台外壳</h1>
<p>真正承载应用的是下面这层 iframe，外壳自己没有可交互控件。</p>
<iframe src="app.html" title="app"></iframe>

<!-- 没有任何 GSPP 相关代码：这一页是「外壳 + iframe 内嵌应用」形态的边界夹具。
     形状取自实测的魔搭创空间：顶层只有一个壳，应用文档在子 frame 里。
     外壳故意不放按钮，好让 env._resolve_frame() 必须挑中子 frame ——
     挑不中子 frame 的话，段 G 的前提断言会当场判红，而不是静默量了主文档。 -->
</body>
</html>
